# quarto render

project:
  type: website
  resources: 
    - "cc_full.csv"
    - "cleSac.txt"
    - "dem_score.csv"
    - "dem_score.xlsx"
    - "global13sdss_0.sav"
    - "imf_data.rds"
    - "le_mess.csv"
    - "periodic-table-data.csv"
    - "pnwflights23.xlsx"
    - "spotify_dataset.csv"
    - "wash-or_black.csv"
    - "202*-nba-over-under.html"
    - "202*-nba-over-under-preview.html"
    - "202*-nba-over-under-playoffs.html"
    - "nba-over-under-assets/**"
    - "critical_thinking_framework.pdf"
    - "nba-scenario-explorer.html"
    - "202*-nba-scenario-explorer.html"
    - "202*-nba-rooting-guide.html"
    - "us-statehood.html"
    - "projects/**"
    # 2000-01 Newell boys basketball season page, built by
    # ~/repos/senior-bball-clipping/build_page.py (unlisted: noindex, no nav link)
    - "newell-2000-01/**"
    - "nba-over-under-2025-2026/final-day-scenarios.html"
    # Redirects to nba-fantasy-draft.netlify.app, where the drafts moved
    - "nba-over-under-202*/fantasy-draft/**/index.html"
    - "teaching/sample_problems/*.html"
    - "nba-player-finder/**"
    # Netlify only: sends /ouanalytics/ to the package site on GitHub Pages, and the
    # old hostnames (chester.rbind.io, chester.netlify.app) to chesterismay.com
    - "_redirects"
  output-dir: docs  # for GitHub Pages compatibility
  render:
    - index.qmd
    - about.qmd
    - consulting.qmd
    - workshops.qmd
    - talks.qmd
    - portfolio.qmd
    - 404.qmd
    - ecots2k16/template_pkg.qmd

website:
  title: "Chester Ismay"
  # The site's home since October 23, 2026 (Cloudflare registrar and DNS, served by
  # Netlify). ismayc.github.io keeps serving a copy because other repos read data
  # files from it; its HTML pages carry a canonical tag and redirect here.
  site-url: https://chesterismay.com
  google-analytics: "G-T8CFEJLX14"
  cookie-consent: true
  description: "Dr. Chester Ismay helps individuals and teams use AI and data science with confidence through consulting, education, speaking, and open-source tools."
  favicon: images/favicon.png
  image: images/social-card.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  page-footer:
    left: "&copy; 2026 Chester Ismay"
    right:
      - icon: github
        href: https://github.com/ismayc
      - icon: linkedin
        href: https://www.linkedin.com/in/chesterismay/
      - icon: envelope
        href: mailto:chester.ismay@gmail.com
  navbar:
    left:
      - text: "About"
        href: about.qmd
      - text: "Consulting"
        href: consulting.qmd
      - text: "Workshops"
        href: workshops.qmd
      - text: "Talks"
        href: talks.qmd
      - text: "Portfolio"
        href: portfolio.qmd
    right:
      - icon: github
        href: https://github.com/ismayc
      - icon: linkedin
        href: https://www.linkedin.com/in/chesterismay/
      - icon: twitter
        href: https://twitter.com/old_man_chester
      - icon: envelope
        href: mailto:chester.ismay@gmail.com

format:
  html:
    theme: [sandstone, theme.scss]
    css: styles.css
    include-in-header:
      - includes/person-schema.html
      - includes/host-redirect.html
    # <link rel="canonical"> on every page, built from site-url, so search engines
    # fold the ismayc.github.io and old-hostname copies into chesterismay.com
    canonical-url: true
    toc: true
