<!doctype html>
<!-- Link-preview source for og.png. Re-render from the repo root with:
     python3 -I ~/.claude/skills/web-page-meta/render_meta.py --dir nba-player-finder --bg "#15171C" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500&family=Big+Shoulders+Display:wght@800&display=block">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; margin: 0; }
  body { background: #EEF0EC; color: #15171C; font-family: Barlow, sans-serif; padding: 72px 80px; box-sizing: border-box; position: relative; }
  h1 { font: 800 150px/0.86 "Big Shoulders Display", sans-serif; margin: 0; }
  p { font-size: 36px; color: #5D6370; margin: 28px 0 0; max-width: 1040px; line-height: 1.3; }
  .row { position: absolute; left: 80px; bottom: 72px; display: flex; gap: 22px; }
  .j { width: 118px; height: 118px; border-radius: 12px 12px 20px 20px; display: grid; place-items: center;
       font: 800 74px/1 "Big Shoulders Display", sans-serif; box-shadow: inset 0 -11px 0 var(--t); background: var(--b); color: var(--f); }
  .j span { margin-top: -12px; }
</style></head>
<body>
  <h1>NBA Player Finder</h1>
  <p>Name a player from a jersey number, height, age, and team.</p>
  <div class="row">
    <div class="j" style="--b:#552583;--f:#FDB927;--t:#FDB927"><span>23</span></div>
    <div class="j" style="--b:#007A33;--f:#fff;--t:#BA9653"><span>0</span></div>
    <div class="j" style="--b:#0E2240;--f:#FEC524;--t:#8B2131"><span>15</span></div>
    <div class="j" style="--b:#007AC1;--f:#fff;--t:#EF3B24"><span>2</span></div>
    <div class="j" style="--b:#000;--f:#C4CED4;--t:#C4CED4"><span>1</span></div>
    <div class="j" style="--b:#1D428A;--f:#FFC72C;--t:#FFC72C"><span>30</span></div>
    <div class="j" style="--b:#98002E;--f:#fff;--t:#F9A01B"><span>13</span></div>
  </div>
</body></html>
