name: build-nba-player-finder

on:
  schedule:
    # Weekly, Mondays 13:00 UTC
    - cron: "0 13 * * 1"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'nba-over-under-2025-2026/rosters/build_roster_csv.py'
      - 'nba-over-under-2025-2026/rosters/tests/js/**'
      - 'nba-player-finder/*.js'
      - '.github/workflows/nba-player-finder.yaml'

jobs:
  build-player-finder:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the refreshed roster
      actions: write    # dispatch the site deploy
    defaults:
      run:
        working-directory: nba-over-under-2025-2026/rosters
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python packages
        run: pip install nba_api pandas requests

      - name: Pull current rosters
        run: python build_roster_csv.py

      # The finder is a static page (nba-player-finder/) that fetches
      # players.csv in the browser; publishing new rosters is a file copy.
      - name: Publish roster to the finder page
        run: cp finder_app/players_finder.csv ../../nba-player-finder/players.csv

      # Gate the deploy on the tests: the fresh roster must satisfy the data
      # contract (over 400 players, all 30 teams with jersey colors, heights
      # consistent) and the filter logic must pass, or the push step never runs.
      - name: Test before deploy
        working-directory: ${{ github.workspace }}
        run: node --test nba-over-under-2025-2026/rosters/tests/js/finder.test.mjs

      - name: Push changes
        id: push
        working-directory: ${{ github.workspace }}
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          # Retry against a moving master (other workflows also commit here).
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git reset --soft origin/master
            git add nba-over-under-2025-2026/rosters/finder_app/players_finder.csv nba-player-finder/players.csv
            if git diff --cached --quiet; then
              echo "No changes to commit"; exit 0
            fi
            git commit -m "GitHub Actions weekly roster refresh"
            if git push origin master; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "Pushed on attempt $attempt"; exit 0
            fi
            echo "Push rejected (attempt $attempt); re-syncing and retrying..."
            sleep $((RANDOM % 5 + 2))
          done
          echo "Failed to push after retries"; exit 1

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # site deploy would otherwise wait for the next human push. A
      # workflow_dispatch from GITHUB_TOKEN is the documented exception.
      - name: Deploy the refreshed roster
        if: steps.push.outputs.pushed == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run quarto-netlify.yaml --ref master
