name: build-nba-webpage
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'nba-over-under-2026-2027/**'

jobs:
  check-date:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.date_check.outputs.should_run }}
    steps:
      # The page cannot build until this season's picks are saved, so skip
      # (rather than fail every day) until rds/gs_picks_raw.rds is committed.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: nba-over-under-2026-2027/rds
          sparse-checkout-cone-mode: false
      - id: date_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_DATE=$(date -u +%Y-%m-%d)
          # The Mac mini builds first (2 AM Phoenix, tools/mini-build.sh) and
          # dispatches this workflow itself when it fails. The scheduled run is
          # only the backup, so it skips when a page build already landed today.
          BUILT_TODAY=$(gh api "repos/${{ github.repository }}/commits?path=2027-nba-over-under.html&since=${CURRENT_DATE}T00:00:00Z" --jq length 2>/dev/null || echo 0)
          CUTOFF_DATE="2027-04-12"
          # The preseason preview holds the season URL until a game is played
          # (opening night is 2026-10-20, so the first build is the 21st).
          FIRST_BUILD_DATE="2026-10-21"
          if [[ ! -f nba-over-under-2026-2027/rds/gs_picks_raw.rds ]]; then
            echo "No 2026-27 picks yet; skipping the build."
            echo "should_run=false" >> $GITHUB_OUTPUT
          elif [[ "$CURRENT_DATE" < "$FIRST_BUILD_DATE" ]]; then
            echo "No games played yet; the preview stays up until $FIRST_BUILD_DATE."
            echo "should_run=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "schedule" && "$BUILT_TODAY" != "0" ]]; then
            echo "A page build already landed today (the mini); the scheduled backup skips."
            echo "should_run=false" >> $GITHUB_OUTPUT
          elif [[ "$CURRENT_DATE" < "$CUTOFF_DATE" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi
  # A failing test, or coverage under 100% of the ouanalytics package,
  # stops the build, so the last good page stays up.
  test:
    runs-on: ubuntu-latest
    needs: check-date
    if: ${{ needs.check-date.outputs.should_run == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          extra-packages: |
            any::testthat
            any::covr
            any::dplyr
            any::tidyr
            any::tibble
            any::stringr
      - name: Run tests and check coverage
        run: Rscript nba-over-under-2026-2027/ouanalytics/tools/check.R
  build-nba-webpage:
    runs-on: ubuntu-latest
    needs: [check-date, test]
    if: ${{ needs.check-date.outputs.should_run == 'true' }}
    permissions:
      contents: write   # push the rebuilt page
      actions: write    # dispatch the site deploy
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype-dev libpng-dev libtiff-dev libjpeg-dev python3-venv
          
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          extra-packages: |
            any::remotes
            any::rmarkdown
            any::quarto
            any::httr
            any::jsonlite
            any::tidyverse
            any::magrittr
            any::curl
            any::memoise
            any::furrr
            any::future
            any::glue
            any::stringi
            any::rvest
            any::DT
            any::htmltools
            any::plotly
            any::kableExtra
            any::sessioninfo
            any::reticulate
          
      # The page build calls the tested calculations in this package
      - name: Install the ouanalytics package
        run: R CMD INSTALL nba-over-under-2026-2027/ouanalytics

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      
      - name: Cache reticulate Python environment
        uses: actions/cache@v5
        with:
          path: /home/runner/.virtualenvs/r-reticulate
          key: ${{ runner.os }}-reticulate-py3.13-pandas-nba_api-v2
      
      - name: Install Python packages for reticulate
        run: |
          python -m venv --help > /dev/null 2>&1 || sudo apt-get install -y python3-venv
          Rscript -e "reticulate::virtualenv_create('r-reticulate', python = Sys.which('python'), force = TRUE)"
          Rscript -e "reticulate::virtualenv_install('r-reticulate', c('pandas', 'nba_api', 'bs4'))"
      
      - name: Build webpage
        run: |
          Rscript nba-over-under-2026-2027/make_plot_html.R

      # The tables R just computed, for the cross-check job. Never fails the
      # build: a missing export shows up as a failed cross-check instead.
      - name: Save the tables for the Python cross-check
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: check-export
          path: nba-over-under-2026-2027/check-export
          if-no-files-found: warn

      # Apply the site theme and season strip to the fresh render, and copy
      # it to the repo root (the published copy) alongside docs/. The rooting
      # guide and scenario explorer go first so the season page links the guide.
      - name: Restyle season page
        run: |
          if [ -f 2027-nba-rooting-guide.html ]; then
            python3 nba-over-under-META/site-style/restyle_season_pages.py guide 2027
          fi
          if [ -f 2027-nba-scenario-explorer.html ]; then
            python3 nba-over-under-META/site-style/restyle_season_pages.py explorer 2027
          fi
          python3 nba-over-under-META/site-style/restyle_season_pages.py season 2027

      - name: Push changes
        id: push
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git fetch origin master
          git reset --soft origin/master
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"; exit 0
          fi
          git commit -m "GitHub Actions NBA page build"
          git push origin master
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # site deploy would otherwise wait for the next human push. A
      # workflow_dispatch from GITHUB_TOKEN is the documented exception.
      - name: Deploy the rebuilt page
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run quarto-netlify.yaml --ref master
          
      - name: Session info
        run: |
          Rscript -e "sessioninfo::session_info()"
  # Recompute the day's tables in Python (polars) and compare them with the
  # ones R built. Nothing waits on this job, so a difference fails the run
  # (GitHub then sends its failure email) without holding back the page.
  cross-check:
    runs-on: ubuntu-latest
    needs: build-nba-webpage
    if: ${{ needs.build-nba-webpage.result == 'success' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: check-export
          path: nba-over-under-2026-2027/check-export
      - name: Install the Python package
        run: pip install ./nba-over-under-2026-2027/ouanalytics-py pytest pytest-cov
      - name: Test the Python package against the golden cases
        working-directory: nba-over-under-2026-2027/ouanalytics-py
        run: pytest
      - name: Compare today's R tables with the Python recomputation
        if: ${{ !cancelled() }}
        working-directory: nba-over-under-2026-2027
        run: ouanalytics-check check-export/pool check-export/seeding
