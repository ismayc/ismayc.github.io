[project]
name = "ouanalytics-py"
version = "0.1.0"
description = "Independent polars re-implementation of the ouanalytics R package, checked against its golden outputs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["polars>=2.0"]

[project.scripts]
ouanalytics-check = "ouanalytics_py.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ouanalytics_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ouanalytics_py --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["ouanalytics_py"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
